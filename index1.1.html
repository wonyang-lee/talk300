<title>Daily Talk 300</title>

<style>
/* Layout: one centered column. Header with progress, mode tabs, category chips, then a single study surface.
   The English phrase sits in a speech-bubble block; that is the one bold move, everything else stays quiet. */
:root {
  --bg: #EDF2F4;
  --surface: #FFFFFF;
  --fg: #11212B;
  --muted: #566874;
  --line: #D3DDE3;
  --accent: #0F766E;
  --accent-ink: #FFFFFF;
  --warn: #B45309;
  --warn-bg: #FDF1E3;
  --good: #15803D;
  --good-bg: #E3F5E9;
  --bad: #B42318;
  --bad-bg: #FCE9E7;
  --font-display: 'Bricolage Grotesque', 'Noto Sans KR', system-ui, sans-serif;
  --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C161D; --surface: #14222C; --fg: #E6EEF3; --muted: #92A5B2; --line: #243644;
    --accent: #3CC2AE; --accent-ink: #04231E; --warn: #F0A44B; --warn-bg: #2B2112;
    --good: #4ADE80; --good-bg: #12301E; --bad: #F87171; --bad-bg: #351A1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C161D; --surface: #14222C; --fg: #E6EEF3; --muted: #92A5B2; --line: #243644;
  --accent: #3CC2AE; --accent-ink: #04231E; --warn: #F0A44B; --warn-bg: #2B2112;
  --good: #4ADE80; --good-bg: #12301E; --bad: #F87171; --bad-bg: #351A1A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
html { -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
.brand h1 { font-family: var(--font-display); font-size: 34px; line-height: 1.1; letter-spacing: -0.02em; margin: 0; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.meter { flex: 1 1 200px; max-width: 280px; }
.meter-num { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; color: var(--muted); }
.meter-num b { font-family: var(--font-display); font-size: 26px; color: var(--fg); font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }

.bar-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.tab { border: 0; background: transparent; padding: 8px 18px; border-radius: 10px; font-weight: 500; min-height: 40px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.pill-toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-size: 14px; min-height: 40px; }
.pill-toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 14px; font-size: 14px; min-height: 36px; }
.chip small { color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip[aria-pressed="true"] small { color: inherit; opacity: .75; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 26px 24px; display: flex; flex-direction: column; gap: 18px; }
.label { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.phrase { margin: 4px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.2; letter-spacing: -0.01em; text-wrap: balance; overflow-wrap: anywhere; }
.ko-big { margin: 4px 0 0; font-size: 26px; font-weight: 700; line-height: 1.35; text-wrap: balance; overflow-wrap: anywhere; }
.front { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.front > div { min-width: 0; }
.bubble { position: relative; background: var(--accent); color: var(--accent-ink); border-radius: 20px 20px 20px 4px; padding: 18px 20px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.bubble > div { min-width: 0; }
.bubble .label { color: inherit; opacity: .8; }
.tip { margin: 12px 0 0; padding-top: 10px; border-top: 1px solid currentColor; border-top-color: color-mix(in srgb, currentColor 30%, transparent); font-size: 14px; }
.deck-meta { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.dir { display: flex; gap: 4px; }
.dir button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 99px; font-size: 13px; min-height: 34px; }
.dir button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 12px 18px; border-radius: 12px; font-weight: 500; min-height: 46px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.again { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); }
.btn.reveal { align-self: stretch; border-style: dashed; color: var(--muted); }
.btn kbd { font-family: inherit; font-size: 11px; border: 1px solid currentColor; border-radius: 5px; padding: 0 5px; margin-left: 6px; opacity: .7; }
.grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.icon-btn { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; }
.bubble .icon-btn { background: transparent; border-color: currentColor; color: inherit; }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.center-card { text-align: left; }
.center-card h2 { font-family: var(--font-display); font-size: 26px; margin: 0; letter-spacing: -0.01em; }
.center-card p { margin: 0; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; min-height: 44px; text-align: left; }
.seg button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.seg button:disabled { opacity: .45; cursor: not-allowed; }

.qhead { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px 16px; min-height: 52px; overflow-wrap: anywhere; }
.opt:disabled { cursor: default; }
.opt.ok { border-color: var(--good); background: var(--good-bg); color: var(--good); font-weight: 700; }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.feedback { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.feedback p { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.feedback b { font-family: var(--font-display); }
.wrong-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.wrong-list li { padding: 10px 14px; border-radius: 12px; background: var(--bad-bg); }
.wrong-list b { display: block; font-family: var(--font-display); }
.score { font-family: var(--font-display); font-size: 56px; line-height: 1; margin: 0; }
.score small { font-size: 22px; color: var(--muted); }

.tools { display: grid; gap: 10px; }
.tools input { width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; }
.list-count { color: var(--muted); font-size: 14px; margin: 0; }
.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.item .txt { flex: 1; min-width: 0; }
.item .en { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.3; overflow-wrap: anywhere; }
.item .ko { margin: 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.item.is-known .en { color: var(--muted); }
.check { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line); background: transparent; display: inline-flex; align-items: center; justify-content: center; color: transparent; }
.check svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.reset { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.note { margin: 0; color: var(--muted); font-size: 13px; }

@media (max-width: 640px) {
  body { padding-block: 16px 24px; }
  .wrap { gap: 14px; }
  .brand h1 { font-size: 28px; }
  .meter { flex-basis: 100%; max-width: none; }
  .bar-row { flex-direction: column; align-items: stretch; }
  .tabs { width: 100%; }
  .tab { flex: 1; padding: 8px 4px; text-align: center; min-height: 44px; }
  .pill-toggle { align-self: flex-end; }
  /* category chips scroll edge to edge */
  .chips {
    margin-left: calc(max(16px, env(safe-area-inset-left, 0px)) * -1);
    margin-right: calc(max(16px, env(safe-area-inset-right, 0px)) * -1);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .deck-meta { flex-direction: column; align-items: stretch; gap: 10px; }
  .dir { width: 100%; }
  .dir button { flex: 1; min-height: 40px; }
  .card { padding: 20px 16px; border-radius: 18px; }
  .phrase { font-size: 26px; }
  .ko-big { font-size: 22px; }
  .bubble { padding: 16px; }
  .btn { min-height: 52px; }
  /* main action buttons stay within thumb reach */
  .dock { position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 5; background: var(--bg); padding: 10px 0 8px; box-shadow: 0 -1px 0 var(--line); }
  .row.dock .btn { flex: 1 1 100%; }
  .opt { min-height: 56px; padding: 14px; }
  .seg button { flex: 1 1 auto; }
  .item { padding: 10px 12px; gap: 10px; }
  .check { width: 36px; height: 36px; }
  .score { font-size: 48px; }
  .center-card h2 { font-size: 22px; }
}
@media (hover: none) { .btn kbd { display: none; } }
@media (max-width: 360px) {
  .brand h1 { font-size: 25px; }
  .phrase { font-size: 23px; }
  .ko-big { font-size: 20px; }
  .tab { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>

  ];

  var ITEMS = [];
  RAW.forEach(function (c) {
    c.lines.trim().split('\n').forEach(function (line) {
      var p = line.split('|');
      ITEMS.push({ id: ITEMS.length + 1, cat: c.id, en: p[0].trim(), ko: p[1].trim(), tip: (p[2] || '').trim() });
    });
  });
  var TOTAL = ITEMS.length;

  /* ---------- persistence ---------- */
  var KEY = 'dailytalk300.v1';
  var known = new Set();
  var prefs = { slow: false };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var o = JSON.parse(raw);
      known = new Set(o.known || []);
      prefs = Object.assign(prefs, o.prefs || {});
    }
  } catch (e) {}
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ known: Array.from(known), prefs: prefs })); } catch (e) {}
  }

  /* ---------- speech ---------- */
  var canSpeak = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
  function speak(text) {
    if (!canSpeak) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = prefs.slow ? 0.7 : 0.95;
      var voices = window.speechSynthesis.getVoices();
      for (var i = 0; i < voices.length; i++) { if (voices[i].lang === 'en-US') { u.voice = voices[i]; break; } }
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* ---------- helpers ---------- */
  var state = { mode: 'card', cat: 'all', dir: 'ko2en', revealed: false, queue: [], quiz: null, quizType: 'read', q: '', status: 'all', confirmReset: false };
  var view = document.getElementById('view');
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function byId(id) { return ITEMS[id - 1]; }
  function pool() { return ITEMS.filter(function (it) { return state.cat === 'all' || it.cat === state.cat; }); }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  var ICON_SPEAK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
  var ICON_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';
  function speakBtn(id, label) {
    if (!canSpeak) return '';
    return '<button class="icon-btn" data-act="speak" data-id="' + id + '" aria-label="' + (label || '발음 듣기') + '">' + ICON_SPEAK + '</button>';
  }

  function buildQueue() {
    state.queue = shuffle(pool().filter(function (it) { return !known.has(it.id); }).map(function (it) { return it.id; }));
    state.revealed = false;
  }

  /* ---------- header / chips / tabs ---------- */
  function paintHeader() {
    document.getElementById('knownCount').textContent = known.size;
    document.getElementById('barFill').style.width = (known.size / TOTAL * 100) + '%';
    var counts = {}; RAW.forEach(function (c) { counts[c.id] = { k: 0, t: 0 }; });
    ITEMS.forEach(function (it) { counts[it.cat].t++; if (known.has(it.id)) counts[it.cat].k++; });
    var html = '<button class="chip" data-act="cat" data-v="all" aria-pressed="' + (state.cat === 'all') + '">전체<small>' + known.size + '/' + TOTAL + '</small></button>';
    RAW.forEach(function (c) {
      html += '<button class="chip" data-act="cat" data-v="' + c.id + '" aria-pressed="' + (state.cat === c.id) + '">' + esc(c.name) + '<small>' + counts[c.id].k + '/' + counts[c.id].t + '</small></button>';
    });
    document.getElementById('chips').innerHTML = html;
  }
  function paintTabs() {
    var tabs = [['card', '카드 학습'], ['quiz', '퀴즈'], ['list', '전체 목록']];
    document.getElementById('tabs').innerHTML = tabs.map(function (t) {
      return '<button class="tab" role="tab" data-act="mode" data-v="' + t[0] + '" aria-selected="' + (state.mode === t[0]) + '">' + t[1] + '</button>';
    }).join('');
    var slow = document.getElementById('slowBtn');
    slow.setAttribute('aria-pressed', String(!!prefs.slow));
    slow.hidden = !canSpeak;
  }

  /* ---------- card mode ---------- */
  function renderCard() {
    if (!state.queue.length) {
      view.innerHTML = '<section class="card center-card"><h2>이 묶음은 모두 외웠어요</h2><p>' + pool().length + '개 표현을 전부 익혔어요. 퀴즈로 한 번 더 확인하거나, 처음부터 다시 볼 수 있어요.</p>' +
        '<div class="row"><button class="btn primary" data-act="mode" data-v="quiz">퀴즈 풀기</button><button class="btn" data-act="restudy">처음부터 다시 보기</button></div></section>';
      return;
    }
    var it = byId(state.queue[0]);
    var en2ko = state.dir === 'en2ko';

    } else {
      front = '<div class="front"><div><p class="label">영어로 뭐라고 할까요?</p><p class="ko-big">' + esc(it.ko) + '</p></div></div>';

    }
    var html = '<div class="deck-meta"><span>' + state.queue.length + '개 남음</span>' +
      '<div class="dir" role="group" aria-label="출제 방향"><button data-act="dir" data-v="ko2en" aria-pressed="' + !en2ko + '">한국어 → 영어</button><button data-act="dir" data-v="en2ko" aria-pressed="' + en2ko + '">영어 → 한국어</button></div></div>' +
      '<article class="card">' + front +
      (state.revealed ? '<div class="bubble">' + back + '</div>' : '<button class="btn reveal" data-act="reveal">정답 보기</button>') +
      '</article>';
    if (state.revealed) {
      html += '<div class="grade dock"><button class="btn again" data-act="again">다시 볼래요<kbd>1</kbd></button><button class="btn primary" data-act="got">외웠어요<kbd>2</kbd></button></div>';
    }
    if (!canSpeak) html += '<p class="note">이 환경에서는 음성 재생을 지원하지 않아요. 소리 없이 학습할 수 있어요.</p>';
    view.innerHTML = html;
  }

  /* ---------- quiz mode ---------- */
  function startQuiz() {
    var picks = shuffle(pool()).slice(0, 10);
    state.quiz = {
      type: state.quizType, i: 0, score: 0, wrong: [], done: false,
      qs: picks.map(function (it) {
        var others = shuffle(ITEMS.filter(function (x) { return x.cat === it.cat && x.id !== it.id; })).slice(0, 3).map(function (x) { return x.id; });
        return { id: it.id, opts: shuffle([it.id].concat(others)), picked: null };
      })
    };
  }
  function speakQuestion() {
    var z = state.quiz;
    if (state.mode === 'quiz' && z && !z.done && z.type === 'listen' && z.qs[z.i].picked === null) speak(byId(z.qs[z.i].id).en);
  }
  function renderQuiz() {
    var z = state.quiz;
    if (!z) {
      view.innerHTML = '<section class="card center-card"><h2>10문제 퀴즈</h2><p>선택한 묶음에서 10문제를 내요. 틀린 표현은 카드 학습에 다시 나와요.</p>' +
        '<div class="seg" role="group" aria-label="퀴즈 유형"><button data-act="qtype" data-v="read" aria-pressed="' + (state.quizType === 'read') + '">뜻 보고 영어 고르기</button>' +
        '<button data-act="qtype" data-v="listen" aria-pressed="' + (state.quizType === 'listen') + '"' + (canSpeak ? '' : ' disabled') + '>듣고 뜻 고르기</button></div>' +
        (canSpeak ? '' : '<p class="note">듣기 퀴즈는 음성 재생이 되는 환경에서만 쓸 수 있어요.</p>') +
        '<div class="row"><button class="btn primary" data-act="qstart">퀴즈 시작</button></div></section>';
      return;
    }
    if (z.done) {
      var n = z.qs.length;
      var html = '<section class="card center-card"><p class="label">결과</p><p class="score">' + z.score + '<small> / ' + n + '</small></p>';
      html += z.wrong.length ? '<p>틀린 표현은 외운 목록에서 빠졌어요. 카드 학습에서 다시 만나요.</p><ul class="wrong-list">' +
        z.wrong.map(function (id) { var it = byId(id); return '<li><b>' + esc(it.en) + '</b>' + esc(it.ko) + '</li>'; }).join('') + '</ul>' : '<p>전부 맞혔어요.</p>';
      html += '<div class="row"><button class="btn primary" data-act="qstart">새 퀴즈</button><button class="btn" data-act="mode" data-v="card">카드로 복습</button></div></section>';
      view.innerHTML = html;
      return;
    }
    var q = z.qs[z.i], it = byId(q.id), n2 = z.qs.length, listen = z.type === 'listen';
    var prompt = listen
      ? '<div class="front"><div><p class="label">듣고 뜻을 고르세요</p><p class="ko-big">무슨 뜻일까요?</p></div>' + speakBtn(it.id, '다시 듣기') + '</div>'
      : '<div class="front"><div><p class="label">알맞은 영어 표현은?</p><p class="ko-big">' + esc(it.ko) + '</p></div></div>';
    var opts = q.opts.map(function (oid, idx) {
      var o = byId(oid), cls = 'opt', dis = '';
      if (q.picked !== null) {
        dis = ' disabled';
        if (oid === q.id) cls += ' ok'; else if (oid === q.picked) cls += ' bad';
      }
      return '<button class="' + cls + '" data-act="pick" data-v="' + oid + '"' + dis + '>' + (idx + 1) + '. ' + esc(listen ? o.ko : o.en) + '</button>';
    }).join('');
    var html2 = '<div class="qhead"><span>' + (z.i + 1) + ' / ' + n2 + '</span><span>맞은 개수 ' + z.score + '</span></div>' +
      '<div class="bar"><i style="width:' + (z.i / n2 * 100) + '%"></i></div>' +
      '<article class="card">' + prompt + '</article><div class="opts">' + opts + '</div>';
    if (q.picked !== null) {
      html2 += '<div class="feedback"><p>' + (q.picked === q.id ? '정답이에요. ' : '아쉬워요. ') + '<b>' + esc(it.en) + '</b> ' + esc(it.ko) + '</p>' + speakBtn(it.id) + '</div>' +
        '<div class="row dock"><button class="btn primary" data-act="next">' + (z.i < n2 - 1 ? '다음 문제' : '결과 보기') + '</button></div>';
    }
    view.innerHTML = html2;
  }

  /* ---------- list mode ---------- */
  function renderList() {
    var segs = [['all', '전체'], ['todo', '아직 못 외움'], ['done', '외움']];
    view.innerHTML = '<div class="tools"><input id="q" type="search" placeholder="표현이나 뜻으로 검색" value="' + esc(state.q) + '" aria-label="검색">' +
      '<div class="seg" role="group" aria-label="상태 필터">' + segs.map(function (s) {
        return '<button data-act="status" data-v="' + s[0] + '" aria-pressed="' + (state.status === s[0]) + '">' + s[1] + '</button>';
      }).join('') + '</div></div><p class="list-count" id="listCount"></p><ul class="rows" id="rows"></ul>' +
      '<div class="reset">' + (state.confirmReset
        ? '<span>모든 진도를 지울까요?</span><button class="btn again" data-act="resetDo">지우기</button><button class="btn" data-act="resetNo">취소</button>'
        : '<button class="btn" data-act="resetAsk">진도 초기화</button>') + '</div>';
    paintRows();
  }
  function paintRows() {
    var q = state.q.trim().toLowerCase();
    var list = pool().filter(function (it) {
      if (state.status === 'todo' && known.has(it.id)) return false;
      if (state.status === 'done' && !known.has(it.id)) return false;
      if (q && it.en.toLowerCase().indexOf(q) < 0 && it.ko.indexOf(q) < 0) return false;
      return true;
    });
    document.getElementById('listCount').textContent = list.length + '개 표현';
    document.getElementById('rows').innerHTML = list.length ? list.map(function (it) {
      var k = known.has(it.id);
      return '<li class="item' + (k ? ' is-known' : '') + '"><button class="check" data-act="toggle" data-id="' + it.id + '" aria-pressed="' + k + '" aria-label="외움 표시">' + ICON_CHECK + '</button>' +
        '<div class="txt"><p class="en">' + esc(it.en) + '</p><p class="ko">' + esc(it.ko) + '</p></div>' + speakBtn(it.id) + '</li>';
    }).join('') : '<li class="note">조건에 맞는 표현이 없어요.</li>';
  }

  /* ---------- render + actions ---------- */
  function render() {
    paintTabs();
    paintHeader();
    if (state.mode === 'card') renderCard();
    else if (state.mode === 'quiz') renderQuiz();
    else renderList();
  }

  function act(name, v, id) {
    var z = state.quiz;
    switch (name) {
      case 'mode': state.mode = v; state.confirmReset = false; if (v === 'card') buildQueue(); if (v === 'quiz') state.quiz = null; render(); break;
      case 'cat': state.cat = v; buildQueue(); state.quiz = null; render(); break;
      case 'dir': state.dir = v; state.revealed = false; render(); break;
      case 'reveal': state.revealed = true; render(); if (state.dir === 'ko2en') speak(byId(state.queue[0]).en); break;
      case 'again': state.queue.push(state.queue.shift()); state.revealed = false; render(); break;
      case 'got': known.add(state.queue.shift()); save(); state.revealed = false; render(); break;
      case 'speak': speak(byId(+id).en); break;
      case 'slow': prefs.slow = !prefs.slow; save(); paintTabs(); break;
      case 'restudy': pool().forEach(function (it) { known.delete(it.id); }); save(); buildQueue(); render(); break;
      case 'qtype': state.quizType = v; render(); break;
      case 'qstart': startQuiz(); render(); speakQuestion(); break;
      case 'pick':
        if (!z || z.done) break;
        var q = z.qs[z.i];
        if (q.picked !== null) break;
        q.picked = +v;
        if (q.picked === q.id) z.score++;
        else { z.wrong.push(q.id); known.delete(q.id); save(); }
        render();
        break;
      case 'next':
        if (!z) break;
        if (z.i < z.qs.length - 1) { z.i++; } else { z.done = true; }
        render(); speakQuestion();
        break;
      case 'status': state.status = v; renderList(); break;
      case 'toggle':
        id = +id;
        if (known.has(id)) known.delete(id); else known.add(id);
        save(); paintHeader(); paintRows();
        break;
      case 'resetAsk': state.confirmReset = true; renderList(); break;
      case 'resetNo': state.confirmReset = false; renderList(); break;
      case 'resetDo': known.clear(); save(); state.confirmReset = false; buildQueue(); render(); break;
    }
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    act(b.dataset.act, b.dataset.v, b.dataset.id);
  });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'q') { state.q = e.target.value; paintRows(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.target !== document.body || e.metaKey || e.ctrlKey || e.altKey) return;
    if (state.mode === 'card' && state.queue.length) {
      if (!state.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); act('reveal'); }
      else if (state.revealed && e.key === '1') act('again');
      else if (state.revealed && e.key === '2') act('got');
    } else if (state.mode === 'quiz' && state.quiz && !state.quiz.done) {
      var q = state.quiz.qs[state.quiz.i], n = parseInt(e.key, 10);
      if (q.picked === null && n >= 1 && n <= q.opts.length) act('pick', q.opts[n - 1]);
      else if (q.picked !== null && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act('next'); }
    }
  });
  if (canSpeak) { try { window.speechSynthesis.getVoices(); } catch (e) {} }

  buildQueue();
  render();
})();
</script>

</body></html>
